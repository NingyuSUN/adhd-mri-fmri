[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adhd-fmri-benchmark"
version = "1.0.0"
description = "Evidence replay and reproducible interfaces for an ADHD-200 fMRI case study"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "pandas>=2.2", "scikit-learn>=1.6", "scipy>=1.13", "joblib>=1.4", "threadpoolctl>=3.5"]

[project.optional-dependencies]
models = ["torch>=2.6", "nilearn==0.12.1", "nibabel==5.3.2", "packaging==25.0"]
slides = ["python-pptx==1.0.2", "reportlab==4.4.9"]

[project.scripts]
adhd-fmri-benchmark = "adhd_fmri_benchmark.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adhd_fmri_benchmark = ["frozen_v1/*.json", "frozen_v1/*.py"]
