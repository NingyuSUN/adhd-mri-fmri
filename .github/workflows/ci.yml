name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reproduction/requirements-statistics.lock
      - name: Install locked statistics environment
        run: python -m pip install -r reproduction/requirements-statistics.lock
      - name: Run deterministic unit tests
        run: python -m pytest reproduction/tests -q
      - name: Run aggregate-only quickstart
        run: python tools/quickstart.py --check
      - name: Validate public artifacts
        run: python tools/validate_public_artifacts.py
      - name: Check Python syntax without writing bytecode
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = list(Path("reproduction").rglob("*.py")) + list(Path("reporting").rglob("*.py")) + list(Path("tools").rglob("*.py"))
          for path in files:
              ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print(f"parsed {len(files)} Python files")
          PY
